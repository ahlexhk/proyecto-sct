<mat-sidenav-container class="mainWrapper blue_theme" autosize autoFocus dir="ltr">
  <!-- ============================================================== -->
  <!-- Vertical Sidebar -->
  <!-- ============================================================== -->

  <mat-sidenav #leftsidenav [mode]="isOver ? 'over' : 'side'" [opened]="!isOver"
    (openedChange)="onSidenavOpenedChange($event)" (closedStart)="onSidenavClosedStart()" class="sidebarNav">
    <div class="flex-layout">
      <app-sidebar (toggleMobileNav)="sidenav.toggle()" [showToggle]="isOver"></app-sidebar>
      <ng-scrollbar class="position-relative" style="height: 100%">
        <mat-nav-list class="sidebar-list">
          @for(item of navItems; track item) {
          <app-nav-item [item]="item" (notify)="sidenav.toggle()">
          </app-nav-item>
          }
        </mat-nav-list>
      </ng-scrollbar>
      <div class="p-16 m-t-16">




      </div>
    </div>
  </mat-sidenav>


  <!-- ============================================================== -->
  <!-- Main Content -->
  <!-- ============================================================== -->
  <mat-sidenav-content class="contentWrapper p-l-24 p-r-24" #content>

    <main class="pageWrapper maxWidth">
      <!-- ============================================================== -->
      <!-- VerticalHeader -->
      <!-- ============================================================== -->

      <ng-container>
        <app-header [showToggle]="!isOver" (toggleCollapsed)="toggleCollapsed()"
          (toggleMobileNav)="sidenav.toggle()"></app-header>
      </ng-container>

      <!-- Banner de incidencias pendientes: visible en todas las páginas -->
      <ng-container *ngIf="authService.isLoggedIn() && (notificationService.pendientes$ | async) as pendientes">
        <a class="alert-banner card-enter" *ngIf="pendientes > 0"
          [class.alert-critical]="((notificationService.criticas$ | async) ?? 0) > 0"
          [routerLink]="['/ui-components/incidents']">
          <span class="alert-dot"></span>
          <span class="alert-text">
            {{ pendientes }} incidencia{{ pendientes === 1 ? '' : 's' }} de soporte pendiente{{ pendientes === 1 ? '' : 's' }}
            <ng-container *ngIf="((notificationService.criticas$ | async) ?? 0) as criticas">
              <strong *ngIf="criticas > 0"> · {{ criticas }} crítica{{ criticas === 1 ? '' : 's' }}</strong>
            </ng-container>
          </span>
          <span class="alert-action">Atender →</span>
        </a>
      </ng-container>

      <div class="m-t-30">

        <!-- ============================================================== -->
        <!-- Outlet -->
        <!-- ============================================================== -->
        <router-outlet></router-outlet>
      </div>

    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
