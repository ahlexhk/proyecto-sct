<mat-toolbar class="topbar">

  <!-- Mobile Menu -->
  <button mat-icon-button (click)="toggleMobileNav.emit()" class="d-flex d-md-none justify-content-center">
    <i-tabler name="menu-2" class="icon-20 d-flex"></i-tabler>
  </button>

  <span class="flex-1-auto"></span>

  <!-- Cambio de tema claro/oscuro -->
  <button mat-icon-button (click)="themeService.toggle()"
    [attr.aria-label]="themeService.isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
    <i-tabler class="d-flex" [name]="themeService.isDark() ? 'sun' : 'moon'"></i-tabler>
  </button>

  <!-- Notificaciones de incidencias (solo con sesión): el contador muestra
       las incidencias pendientes para tenerlas siempre a la vista -->
  <ng-container *ngIf="authService.isLoggedIn()">
    <button mat-icon-button [matMenuTriggerFor]="notifmenu" aria-label="Notificaciones de incidencias"
      (menuOpened)="notificationService.marcarLeidas()" class="notif-bell">
      <i-tabler class="d-flex" name="bell"
        [matBadge]="(notificationService.pendientes$ | async) || null"
        matBadgeColor="warn" matBadgeSize="small"></i-tabler>
    </button>

    <mat-menu #notifmenu="matMenu" xPosition="before" class="cardWithShadow notif-menu">
      <div class="notif-header">
        <span class="notif-title">Notificaciones</span>
        <span class="notif-pending" *ngIf="(notificationService.pendientes$ | async) as pendientes">
          {{ pendientes }} incidencia{{ pendientes === 1 ? '' : 's' }} pendiente{{ pendientes === 1 ? '' : 's' }}
        </span>
      </div>

      <ng-container *ngIf="(notificationService.eventos$ | async) as eventos">
        <div class="notif-empty" *ngIf="eventos.length === 0">
          Sin actividad reciente. Aquí verás cuando pidan soporte.
        </div>
        <button mat-menu-item class="notif-item" *ngFor="let e of eventos" (click)="abrirIncidencia()">
          <div class="notif-item-body">
            <div class="notif-item-head">
              <span class="notif-kind" [ngClass]="'kind-' + e.tipo">{{ descripcionEvento(e.tipo) }}</span>
              <span class="notif-date">{{ e.created_at | date:'dd/MM HH:mm' }}</span>
            </div>
            <div class="notif-item-title">
              <span class="bn-tag" *ngIf="e.bienNacional">{{ e.bienNacional }}</span>
              {{ e.titulo }}
            </div>
            <div class="notif-item-meta">#{{ e.incident_id }} · {{ e.autor }}<span *ngIf="e.comentario"> · “{{ e.comentario }}”</span></div>
          </div>
        </button>
      </ng-container>

      <div class="notif-footer">
        <button mat-stroked-button color="primary" class="w-100 btn-press" (click)="abrirIncidencia()">
          Ver incidencias
        </button>
      </div>
    </mat-menu>
  </ng-container>

  <!-- Sesión iniciada: avatar con menú -->
  <ng-container *ngIf="authService.isLoggedIn(); else loginLink">
    <button class="m-l-10" mat-icon-button [matMenuTriggerFor]="profilemenu" aria-label="Menú de usuario">
      <div class="initials-circle">
        <span class="initials-text">{{ getUserInitials() }}</span>
      </div>
    </button>

    <mat-menu #profilemenu="matMenu" xPosition="before" class="cardWithShadow">
      <div class="p-x-12 p-y-8 user-summary" *ngIf="getUserName()">
        <div class="user-name">{{ getUserName() }}</div>
        <div class="user-cargo">{{ getUserCargo() }}</div>
      </div>
      <div class="p-x-12">
        <button mat-stroked-button color="primary" class="w-100 btn-press" (click)="logout()">Cerrar sesión</button>
      </div>
    </mat-menu>
  </ng-container>

  <!-- Sin sesión: acceso directo al login -->
  <ng-template #loginLink>
    <a mat-stroked-button color="primary" class="btn-press" [routerLink]="['/authentication/login']">
      Iniciar sesión
    </a>
  </ng-template>
</mat-toolbar>
